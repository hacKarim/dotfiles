name: lint

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck install.sh bin/* || true
      - run: |
          curl -sSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/latest/download/shfmt_v3.8.0_linux_amd64
          chmod +x /tmp/shfmt
          /tmp/shfmt -d -i 2 -ci install.sh bin/* || true
      # the || true above dates from when every script failed; the
      # doctor script is clean, so new scripts should be too
