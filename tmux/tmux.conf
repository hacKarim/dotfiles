# tmux
set -g default-shell /bin/zsh
# closing a window should not leave a gap
set -g renumber-windows on
# so the editor notices it lost focus
set -g focus-events on
# the default scrollback is too short
set -g history-limit 50000
# match the window numbering
set -g pane-base-index 1
# resizing panes by hand is faster
set -g mouse on
# ctrl-b fights with readline
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# window 0 is an awkward reach
set -g base-index 1
# vim mode switching felt laggy
set -g escape-time 10
# the bottom row collides with the shell
set -g status-position top
# colours were wrong inside vim
set -g default-terminal tmux-256color
# tidied 21
# tidied 22
# tidied 44
# tidied 53
# tidied 78
# tidied 114
# tidied 301
# tidied 338

# the default split starts in $HOME, which is never what I want
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "reloaded"
# note 28

set -g allow-rename off
